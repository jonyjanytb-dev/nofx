name: AI Free Validate

on:
  push:
    branches:
      - feature/ai-free-trader

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go format check
        run: |
          files="store/strategy.go store/decision.go store/ai_free_config.go store/trading_session.go kernel/engine.go kernel/engine_prompt.go kernel/engine_analysis.go kernel/engine_ai_free.go kernel/engine_ai_free_market.go market/types.go market/data.go market/data_exchange.go mcp/config.go mcp/client.go mcp/ai_free_config.go trader/auto_trader.go trader/auto_trader_loop.go trader/auto_trader_orders.go trader/auto_trader_ai_free_risk.go trader/auto_trader_ai_free_cycle.go trader/auto_trader_ai_free_protection.go trader/auto_trader_session_risk.go"
          bad=$(gofmt -l $files)
          test -z "$bad" || (echo "$bad"; exit 1)
      - name: Focused tests
        run: go test ./kernel ./market ./mcp ./store ./trader
      - name: Full backend tests
        run: go test ./...
      - name: Vet changed packages
        run: go vet ./kernel ./market ./mcp ./store ./trader
